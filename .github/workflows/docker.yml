name: Docker client

on:
  pull_request:
    paths:
      - docker/**
      - .github/workflows/docker.yml
  push:
    branches: [main]
    paths:
      - docker/**
      - .github/workflows/docker.yml
    tags: [docker-v*]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest docker/test_monitor.py
      - run: docker build -t arethelightson-client-docker ./docker

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/docker-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./docker
          push: true
          tags: |
            ghcr.io/theloudsteve/arethelightson-client-docker:latest
            ghcr.io/theloudsteve/arethelightson-client-docker:${{ github.ref_name }}
